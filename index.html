<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunas Routine</title>
<meta name="description" content="A cute, gamified daily routine tracker with quests, XP, streaks and a workout logger.">
<meta name="theme-color" content="#4fc21b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tunas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="wrap">
  <div class="top">
    <button class="stat fire" id="stStreak" type="button" aria-label="Day streak"></button>
    <button class="stat xp" id="stXP" type="button" aria-label="XP today"></button>
    <button class="stat lv" id="stLv" type="button" aria-label="Level"></button>
    <button class="stat snd" id="stSnd" type="button" aria-label="Sound"></button>
    <button class="stat cog" id="stCog" type="button" aria-label="Settings"></button>
  </div>

  <div class="hero">
    <div class="mascot" id="mascot" aria-hidden="true"></div>
    <div class="bubble" id="bubble">Jom start!</div>
  </div>

  <section class="card levels" aria-labelledby="pathTitle">
    <h2 class="lv-title" id="pathTitle">Today</h2>
    <div class="lv-strip" id="path"></div>
    <div class="lv-detail" id="levelDetail"></div>
  </section>

  <div class="card nudge" id="nudge" role="region" aria-labelledby="nudgeT" hidden></div>

  <button class="card prog" id="progressCard" type="button">
    <span class="prog-fl" id="progStreak"></span>
    <span class="prog-lv"><span class="prog-top"><b id="lvName">Level 1</b><span id="lvBar">0 / 250 XP</span></span><span class="bar"><i id="lvFill"></i></span></span>
  </button>

  <details class="card qfold" id="questFold">
    <summary><span class="ri" aria-hidden="true" id="questIco"></span><b data-i18n="dailyQuests">Daily quests</b><span class="pips" id="questPips" aria-hidden="true"></span><small id="questCount"></small><span class="chev" aria-hidden="true"></span></summary>
    <div class="quests" id="quests"></div>
  </details>

  <div class="foot-links">
    <button class="row-link" type="button" id="openHistory"><span class="ri" aria-hidden="true" id="histIco"></span><b data-i18n="history">History</b><span class="chev" aria-hidden="true"></span></button>
    <button class="row-link" type="button" id="openBadges"><span class="ri" aria-hidden="true" id="badgeIco"></span><b data-i18n="badges">Badges</b><small id="badgeMeta"></small></button>
  </div>

  <div class="foot">
    <div id="resetArea"></div>
    <div data-i18n="foot">Everything saves on this phone only. A new day starts at 4am.</div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden>
  <div class="sh-head" id="shHead"></div>
  <div class="sh-body" id="shBody"></div>
</div>

<div class="cele" id="cele" hidden></div>
<div class="cele welcome" id="welcome" role="dialog" aria-modal="true" hidden></div>

<div class="restbar" id="restbar" hidden>
  <div class="in">
    <div class="rt" id="restTime">1:30</div>
    <div class="rl"><b id="restLabel">Rest</b><span data-i18n="restbar">Breathe. Next set at zero.</span><div class="bar"><i id="restFill"></i></div></div>
    <button class="btn ghost small" type="button" id="restPlus">+15s</button>
    <button class="btn ghost small" type="button" id="restSkip" data-i18n="skip">Skip</button>
  </div>
</div>

<div class="updbar" id="updbar" role="status" hidden></div>

<input type="file" id="fileRoutine" accept=".json,application/json" class="vis-hidden" tabindex="-1" aria-hidden="true">
<input type="file" id="fileBackup" accept=".json,application/json" class="vis-hidden" tabindex="-1" aria-hidden="true">

<script src="i18n.js"></script>
<script src="templates.js"></script>
<script src="app.js"></script>
</body>
</html>
